[project]
name = "stego"
version = "0.1.0"
description = "Стеганография: сокрытие данных внутри видеоконтейнеров"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "av>=12.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
# LF-VSN — нейросетевой движок; torch тяжёлый, поэтому вынесен в отдельный extra
lfvsn = ["torch>=2.0"]
# SteganoGAN — нейросетевой движок (картинка): torch + reedsolo (коррекция ошибок)
steganogan = ["torch>=2.0", "reedsolo>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stego = "stego.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stego"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Гарантируем что lock содержит wheels для Intel Mac (macOS x86_64)
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Intel Mac (x86_64) не поддерживается torch>=2.3 — пинаем последнюю совместимую версию
constraint-dependencies = [
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
