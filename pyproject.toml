[project]
name = "stego"
version = "0.1.0"
description = "Стеганография: сокрытие данных внутри видеоконтейнеров. Фаза 1 — LSB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "av>=12.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
# LF-VSN — нейросетевой движок; torch тяжёлый, поэтому вынесен в отдельный extra
lfvsn = ["torch>=2.0"]
# SteganoGAN — нейросетевой движок (картинка): torch + reedsolo (коррекция ошибок)
steganogan = ["torch>=2.0", "reedsolo>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
stego = "stego.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stego"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
